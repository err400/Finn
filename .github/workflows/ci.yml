name: FINN checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finn
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: finn_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: pip install -r backend/requirements-lock.txt
      - run: python scripts/check_release.py
      - run: python -m pytest -q
        working-directory: backend
        env:
          FINN_AUTO_REFRESH_ENABLED: 'false'
          FINN_TEST_POSTGRES_URL: postgresql+psycopg://finn:ci-only-not-a-production-secret@127.0.0.1:5432/finn_audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://example.onrender.com/api/v1
